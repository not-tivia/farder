# From the repo root: docker compose -f deploy/relay/docker-compose.yml up -d --build
services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    image: farder-relay
    restart: unless-stopped
    ports:
      - "4433:4433/udp"
    volumes:
      - relay-data:/data
volumes:
  relay-data:
