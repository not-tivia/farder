# THROWAWAY probe — validate windows-capture 2.0.0 Window enumeration + that a
# capture Settings can be built against a Window (the same trait Monitor uses),
# BEFORE the screenshare-UX feature builds against that API. Detached from the
# parent workspace on purpose. DELETE this folder once the feature ships.
[package]
name = "windowcap-probe"
version = "0.0.0"
edition = "2021"
publish = false

# Empty workspace table = standalone; do NOT join the parent workspace.
[workspace]

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.0"
