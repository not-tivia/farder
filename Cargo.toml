[workspace]
resolver = "2"
members = [
    "crates/farder-crypto",
    "crates/farder-protocol",
    "crates/farder-relay",
    "crates/farder-notify",
    "crates/farder-node",
    "crates/farder-demo",
    "crates/farder-server",
    "crates/farder-mls",
]

[package]
name = "farder"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dev-dependencies]
farder-crypto = { path = "crates/farder-crypto" }
farder-protocol = { path = "crates/farder-protocol" }
farder-node = { path = "crates/farder-node" }
farder-server = { path = "crates/farder-server" }
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[[test]]
name = "e2e_dm"
path = "tests/e2e_dm.rs"

[[test]]
name = "e2e_server"
path = "tests/e2e_server.rs"

[[test]]
name = "security_observation"
path = "tests/security_observation.rs"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
farder-crypto = { path = "crates/farder-crypto" }
farder-protocol = { path = "crates/farder-protocol" }
farder-node = { path = "crates/farder-node" }
farder-server = { path = "crates/farder-server" }
farder-mls = { path = "crates/farder-mls" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
