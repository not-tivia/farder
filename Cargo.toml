[workspace]
resolver = "2"
members = [
    "crates/farder-crypto",
    "crates/farder-protocol",
    "crates/farder-relay",
    "crates/farder-notify",
    "crates/farder-node",
]

[package]
name = "farder"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dev-dependencies]
farder-crypto = { path = "crates/farder-crypto" }
farder-protocol = { path = "crates/farder-protocol" }
farder-node = { path = "crates/farder-node" }

[[test]]
name = "e2e_dm"
path = "tests/e2e_dm.rs"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
farder-crypto = { path = "crates/farder-crypto" }
farder-protocol = { path = "crates/farder-protocol" }
farder-node = { path = "crates/farder-node" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
