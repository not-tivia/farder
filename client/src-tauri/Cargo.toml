[workspace]

[package]
name = "farder-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
farder-crypto = { path = "../../crates/farder-crypto" }
farder-node = { path = "../../crates/farder-node" }
farder-protocol = { path = "../../crates/farder-protocol" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
