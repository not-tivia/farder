[workspace]

[package]
name = "farder-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
send_wrapper = "0.6"
farder-crypto = { path = "../../crates/farder-crypto" }
farder-node = { path = "../../crates/farder-node" }
farder-protocol = { path = "../../crates/farder-protocol" }
farder-e2ee-client = { path = "../../crates/farder-e2ee-client" }
farder-history = { path = "../../crates/farder-history" }
farder-mls = { path = "../../crates/farder-mls" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
audiopus = "0.3.0-rc.0"
quinn = "0.11"
bytes = "1"
rustls = { version = "0.23", features = ["ring"] }
hex = "0.4"
rand = "0.8"
base64 = "0.22"
dirs = "5"
sha2 = "0.10"
flate2 = "1"
rfd = "0.15"
cpal = "0.15"
hound = "3.5"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
# H.264 software encoder/decoder for screensharing. Default `source` feature
# builds the bundled OpenH264 C/C++ via cc (nasm optional). Builds on all
# platforms (validated on Linux + Windows 2026-06-12).
openh264 = "0.9.3"

[target.'cfg(windows)'.dependencies]
# Windows Graphics Capture — screen/window/fullscreen capture. Windows-only;
# on other hosts the mock display backend is used and this isn't compiled.
windows-capture = "2.0.0"
wasapi = "0.23.0"
# GSMTC (Global System Media Transport Controls) — Windows "now playing" source
# for rich presence.  Cfg-gated; not compiled on Linux/macOS.
windows = { version = "0.58", features = ["Media_Control", "Foundation"] }

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"

[build-dependencies]
tauri-build = { version = "2", features = [] }
